name: Vibe check
on:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tyler-rehm/agent-skills
          ref: ${{ github.workflow_sha }}
          path: checker
          sparse-checkout: checks
          persist-credentials: false
      - working-directory: source
        run: node "$GITHUB_WORKSPACE/checker/checks/vibe/check.mjs" --root . --report "$GITHUB_WORKSPACE/vibe-report.md" --quiet --fail-on none
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibe-report
          path: vibe-report.md
          retention-days: 14
